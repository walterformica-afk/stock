<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Giacenze Magazzino</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--br:#e2e5ea;--ac:#2563eb;--ok:#16a34a;--ko:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1c2127;--tx:#eef0f3;--mu:#98a2b3;--br:#2d343c;--ac:#60a5fa;--ok:#4ade80;--ko:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1c2127;--tx:#eef0f3;--mu:#98a2b3;--br:#2d343c;--ac:#60a5fa;--ok:#4ade80;--ko:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:5}
h1{font-size:20px;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
button,input,select{font:inherit;color:var(--tx)}
button{border:1px solid var(--br);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
input,select{width:100%;padding:10px;border:1px solid var(--br);border-radius:10px;background:var(--card)}
.row{display:flex;gap:6px;margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.chips button{white-space:nowrap;padding:6px 12px;border-radius:99px;font-size:14px}
main{padding:0 14px 90px;max-width:720px;margin:auto}
.it{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px;margin-bottom:8px}
.it .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.it b{font-size:15px;word-break:break-all}.mu{color:var(--mu);font-size:13px}
.q{font-size:22px;font-weight:700}.zero{color:var(--ko)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--br);border-radius:6px;padding:1px 6px;margin-right:4px}
.act{display:flex;gap:6px;margin-top:8px}.act button{flex:1;padding:8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:50%;width:56px;height:56px;font-size:28px;padding:0;box-shadow:0 4px 12px #0004}
dialog{border:1px solid var(--br);border-radius:14px;background:var(--card);color:var(--tx);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:#0006}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.mv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--br)}
.in{color:var(--ok)}.out{color:var(--ko)}
.em{text-align:center;color:var(--mu);padding:30px 10px}
.hint{background:var(--card);border:1px dashed var(--br);border-radius:12px;padding:12px;font-size:14px;color:var(--mu);margin-bottom:8px}
.sum{font-size:13px;color:var(--mu);margin:2px 0 8px}
</style>
</head>
<body>
<header>
<h1>📦 Giacenze Magazzino</h1>
<div class="mu" id="upd" style="margin:-4px 0 8px"></div>
<div class="tabs"><button id="t1" class="on">Articoli</button><button id="t2">Movimenti</button><button id="t3">Dati</button></div>
<div id="bar"><div class="row"><input id="q" type="search" placeholder="Cerca articolo, descrizione, macchina"></div>
<div class="chips" id="ch"></div>
<div class="row"><input id="qt" type="search" placeholder="Codice tecnico (es. W09, CX210)"></div>
<div class="row"><select id="sp"></select></div></div>
</header>
<main id="m"></main>


<dialog id="dA"><h3 style="margin:0 0 4px" id="dAt">Articolo</h3>
<label>Articolo (codice)</label><input id="fa">
<label>Descrizione</label><input id="fd">
<label>Specifica tecnica / macchina</label><input id="fs" list="sl">
<datalist id="sl"></datalist>
<label>Deposito</label><input id="fw" list="wl"><datalist id="wl"></datalist>
<label>Giacenza</label><input id="fq" type="number" inputmode="numeric" value="0">
<div class="row" style="margin-top:12px"><button id="aX">Annulla</button><button id="aD" style="display:none;color:var(--ko)">Elimina</button><button class="p" id="aS">Salva</button></div></dialog>

<dialog id="dM"><h3 style="margin:0" id="dMt">Movimento</h3><div class="mu" id="dMs"></div>
<label>Quantità</label><input id="mq" type="number" inputmode="numeric" min="0" value="1">
<label>Nota (facoltativa)</label><input id="mn" placeholder="es. DDT 123, ordine cliente">
<div class="row" style="margin-top:12px"><button id="mX">Annulla</button><button class="p" id="mS">Conferma</button></div></dialog>

   var s=ix('specificatecnica'),a=ix('articolo'),d=ix('descrizione'),q=ix('giacenza'),w=ix('deposito');
   if(a<0||q<0)throw 0;
   var items=[];R.slice(1).forEach(function(r){var code=(r[a]||'').trim();if(!code)return;
    var dp=w>=0?(r[w]||'').trim():'';if(dp=='#N/A')dp='';
    var sp=s>=0?(r[s]||'').trim():'';if(sp.replace(/[ -]/g,'')=='')sp='';
    items.push({id:items.length,s:sp,a:code,d:d>=0?(r[d]||'').trim():'',q:num(r[q]),w:dp})});
   if(!items.length)throw 0;
   var ts=lm?new Date(lm).getTime():NaN;
   S.items=items;S.upd=isNaN(ts)?Date.now():ts;refresh()})
 }).catch(function(){})
}
function bindData(){
 $('ex1').onclick=function(){dl('giacenze.csv',['SpecificaTecnica,Articolo,Descrizione,Giacenza,Deposito'].concat(S.items.map(function(i){return[i.s,i.a,i.d,i.q,i.w].map(cell).join(',')})).join('\n'))};
}
refresh();loadRemote();
})();
